# The quality gate. Every Docker image is built from a commit that passed this workflow: the
# `image` job calls docker-image.yml (a reusable workflow) only once every gate is green, inside
# this same run — so the image, its tags and its signed provenance all name the tested commit.
name: CI · Lint, typecheck & tests

on:
  # Branch work is covered by its pull request; a push-trigger on feature branches as well
  # would run the whole suite twice for every commit on an open PR.
  push:
    branches: ['master']
    # Releases are cut by pushing a bare semver tag. CI runs on it too, so a release
    # image is only published once the tagged commit has passed.
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: ['master']
  workflow_dispatch:

# A newer push to the same PR makes the running check worthless. master and tags are never
# cancelled: each of their runs gates an image.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  # Must match the length of the `shard` list in the e2e job matrix.
  E2E_SHARDS: 6
  # Which runs publish an image: pushes (master, release tags) and pull requests from this
  # repository. Forks and Dependabot get no Docker Hub secrets. The `image` job repeats this
  # condition, because `env` is not available in a job-level `if`.
  IMAGE_WILL_BUILD: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'dependabot/')) }}

jobs:
  static:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Describe this run
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.pull_request.number }}
          E2E_SHARDS: ${{ env.E2E_SHARDS }}
          IMAGE_WILL_BUILD: ${{ env.IMAGE_WILL_BUILD }}
        run: |
          {
            echo "## What this run does"
            echo
            if [ "$EVENT" = "pull_request" ]; then
              echo "Checks pull request **#${PR}** at \`${SHA:0:7}\`."
            else
              echo "Checks \`${REF}\` (\`${EVENT}\`) at \`${SHA:0:7}\`."
            fi
            echo
            echo "| Job | Runs | What it covers |"
            echo "| --- | :-: | --- |"
            echo "| Lint, format & typecheck | ✅ | ESLint, Prettier, \`tsc --noEmit\` |"
            echo "| Unit & functional tests | ✅ | route/verb parity, Japa against PostgreSQL 18 |"
            echo "| E2E tests (1/${E2E_SHARDS} … ${E2E_SHARDS}/${E2E_SHARDS}) | ✅ | Playwright (Chromium) against a production build, split into ${E2E_SHARDS} shards with a database each |"
            if [ "$EVENT" = "pull_request" ]; then
              echo "| E2E auth matrix | ✅ | Playwright, every auth env combination |"
            else
              echo "| E2E auth matrix | ⏭️ | pull requests only |"
            fi
            if [ "$IMAGE_WILL_BUILD" = "true" ]; then
              echo "| Image | ✅ | once all of the above are green: build, push and attest \`houbystudio/fridgora\` |"
            else
              echo "| Image | ⏭️ | pushes to \`master\`, release tags and same-repo PRs only |"
            fi
            echo "| Summary | ✅ | results of everything above, in one place |"
            echo
            echo "The checks run in parallel; the image waits for all of them, the summary for everything."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: TypeScript typecheck
        run: npm run typecheck

  test:
    name: Unit & functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write # required by mikepenz/action-junit-report to post check runs
      pull-requests: write # required to post PR annotations

    # Every job that talks to the app gets its own database and mail catcher (anchored here,
    # reused by the e2e jobs), which is what lets the e2e shards run side by side.
    services: &test-services
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sbf
          POSTGRES_PASSWORD: sbf
          POSTGRES_DB: sbf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        options: >-
          --health-cmd "wget -qO- http://localhost:8025/api/v1/messages || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TZ: UTC
      NODE_ENV: test
      APP_KEY: test-app-key-for-ci-only-123456789
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: sbf
      DB_PASSWORD: sbf
      DB_DATABASE: sbf_test
      SESSION_DRIVER: memory
      LOG_LEVEL: error
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAILPIT_API_URL: http://localhost:8025
      OIDC_ENABLED: 'false'
      API_SECRET: test-api-secret
      APP_URL: http://localhost:3334

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Catches frontend calls whose verb no route accepts — that mismatch answers 404,
      # not 405, so it reads like a wrong URL and is easy to miss in review.
      - name: Route/method parity
        run: npm run check:routes

      - name: Run unit and functional tests
        run: node ace test --no-color

      - name: Verify Japa JUnit report exists
        if: always()
        run: |
          ls -la test-results || true
          test -s test-results/junit-japa.xml

      - name: Publish Japa test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'test-results/junit-japa.xml'
          check_name: 'Japa Test Results'
          require_tests: true
          require_passed_tests: true
          include_passed: true
          detailed_summary: true

      - name: Upload JUnit report for the summary
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-japa
          path: test-results/junit-japa.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload raw test result artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-japa
          path: test-results/**
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: E2E tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One red shard must not cancel the others — the summary should list every failure.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    services: *test-services

    env:
      MAILPIT_API_URL: http://localhost:8025

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Builds the app and migrates a fresh test DB itself (scripts/run_e2e.ts, global_setup.ts).
      # fullyParallel in playwright.config.ts makes --shard split per test, not per file.
      - name: Run Playwright E2E tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Verify Playwright JUnit report exists
        if: always()
        run: |
          ls -la test-results || true
          test -s test-results/junit-e2e.xml

      # Published as one check by the summary job, not one per shard.
      - name: Upload JUnit report for the summary
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-e2e-${{ matrix.shard }}
          path: test-results/junit-e2e.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload raw test result artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-e2e-${{ matrix.shard }}
          path: |
            test-results/**
            playwright-report/**
            playwright-artifacts/**
          if-no-files-found: warn
          retention-days: 14

  e2e-auth-matrix:
    name: E2E auth matrix
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write # required by mikepenz/action-junit-report to post check runs
      pull-requests: write # required to post PR annotations

    services: *test-services

    env:
      MAILPIT_API_URL: http://localhost:8025

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Auth Matrix smoke tests
        run: npm run test:e2e:auth-matrix

      - name: Verify Playwright Auth Matrix JUnit report exists
        if: always()
        run: |
          ls -la test-results || true
          test -s test-results/junit-e2e-auth-matrix.xml

      - name: Publish Playwright Auth Matrix results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'test-results/junit-e2e-auth-matrix.xml'
          check_name: 'Playwright Auth Matrix Results'
          require_tests: true
          require_passed_tests: true
          include_passed: true
          detailed_summary: true

      - name: Upload JUnit report for the summary
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-e2e-auth-matrix
          path: test-results/junit-e2e-auth-matrix.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload raw test result artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-e2e-auth-matrix
          path: |
            test-results/**
            playwright-artifacts/**
          if-no-files-found: warn
          retention-days: 14

  image:
    name: Image
    needs: [static, test, e2e, e2e-auth-matrix]
    # Green gates only. `!cancelled()` lets the job run although e2e-auth-matrix is skipped on
    # pushes; a skipped dependency would otherwise skip this job too.
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (github.event_name == 'push' ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          !startsWith(github.head_ref, 'dependabot/')))
    # The ceiling for the called workflow; each of its jobs narrows this down again.
    permissions:
      contents: write # GitHub Release (release job only)
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/docker-image.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  summary:
    name: Summary
    needs: [static, test, e2e, e2e-auth-matrix, image]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the job/step list of this run, for the summary table
      checks: write # required by mikepenz/action-junit-report to post check runs
      pull-requests: write # required to post PR annotations

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci

      # Node 24 runs the TypeScript script directly (type stripping), so no npm ci here.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download JUnit reports
        uses: actions/download-artifact@v5
        with:
          pattern: junit-*
          path: reports

      # The shards each wrote a partial junit-e2e.xml; one check run covers all of them.
      - name: Publish Playwright E2E results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'reports/junit-e2e-[0-9]*/junit-e2e.xml'
          check_name: 'Playwright E2E Results'
          require_tests: true
          require_passed_tests: true
          include_passed: true
          detailed_summary: true

      - name: Write run summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JUNIT_DIR: reports
          SUMMARY_JOB_NAME: Summary
          # "Next" reports what the image job did, or why there is none for this run.
          CI_CONTEXT: >-
            {
              "event": "${{ github.event_name }}",
              "ref": "${{ github.ref_name }}",
              "sha": "${{ github.event.pull_request.head.sha || github.sha }}",
              "actor": "${{ github.actor }}",
              "prNumber": "${{ github.event.pull_request.number }}",
              "imageWillBuild": ${{ env.IMAGE_WILL_BUILD }}
            }
        run: node scripts/ci/summarize_ci.ts

      # The summary job is green whenever it managed to write the page; this step carries the
      # verdict, so a red test or image job also turns the last box of the graph red.
      - name: Fail if any gate failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::At least one CI job did not pass — see the table above."
          exit 1
