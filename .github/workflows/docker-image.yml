# Builds, publishes and attests houbystudio/fridgora — called by CI (quality.yml) once every gate is green.
#
# It is a reusable workflow on purpose, not a `workflow_run` listener:
#   - a called workflow runs inside the CI run, so `github.ref`/`github.sha` — and with them the
#     OIDC token that signs the attestation — describe the commit that was tested and built.
#     Under `workflow_run` they would name the default branch instead, and the provenance would
#     claim the wrong commit and ref (refs/heads/master for a release tag).
#   - the signing certificate names *this* file as the build signer (job_workflow_ref), separate
#     from the CI that calls it, which is what `gh attestation verify --signer-workflow` checks.
# There is deliberately no other trigger: an image must never be built without the CI gate.
name: Release · Docker image

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

env:
  IMAGE: docker.io/houbystudio/fridgora

jobs:
  build:
    name: Build, push & attest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token for the Sigstore signing certificate
      attestations: write # store the attestation with the repository
      artifact-metadata: write # storage record linking the attestation to Docker Hub
    outputs:
      kind: ${{ steps.meta.outputs.kind }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      # The default checkout is github.sha — the exact commit CI tested and the token attests.
      # For a pull request that is the merge commit, not the branch head.
      - uses: actions/checkout@v4

      # Emulates arm64 for the one stage that has to run on the target architecture (the
      # production `npm ci`); everything else builds natively, see the top of the Dockerfile.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` means "newest release", because that is what a fresh `docker compose up -d`
      # pulls with the default tag in compose.yaml. It must never point at a branch build.
      # CI only runs on bare semver tags, so a tag ref is always a release.
      - name: Compute image tags and build metadata
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tags="${IMAGE}:${SHA}"
          version="dev"

          if [ "${EVENT}" = "push" ] && [ "${REF_TYPE}" = "tag" ] && [[ "${REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            kind="release"
            version="${REF_NAME}"
            tags="${tags},${IMAGE}:${version},${IMAGE}:latest"
          elif [ "${EVENT}" = "push" ] && [ "${REF}" = "refs/heads/master" ]; then
            kind="master"
            tags="${tags},${IMAGE}:master"
          else
            kind="branch"
            alias="$(printf '%s' "${HEAD_REF:-${REF_NAME}}" | tr '/' '-')"
            tags="${tags},${IMAGE}:${alias}"
          fi

          {
            echo "kind=${kind}"
            echo "tags=${tags}"
            echo "version=${version}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## What this run does"
            echo
            echo "CI passed, so this builds \`${IMAGE}\` from \`${REF}\` at \`${SHA:0:7}\` (${kind} build, version \`${version}\`),"
            echo "pushes it and signs a SLSA build provenance attestation for its digest."
            echo
            echo "Tags to push:"
            echo
            for tag in ${tags//,/ }; do echo "- \`${tag}\`"; done
            if [ "${kind}" = "release" ]; then
              echo
              echo "Afterwards a GitHub Release \`${version}\` is created."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: type=registry,ref=houbystudio/fridgora:buildcache
          cache-to: type=registry,ref=houbystudio/fridgora:buildcache,mode=max

      # Signed with a short-lived Sigstore certificate bound to this workflow, the commit and the
      # ref, and stored both with the repository and next to the image on Docker Hub. A tag
      # pushed with a leaked Docker Hub token has no such attestation, and verification fails.
      - name: Attest build provenance
        id: attest
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summarize published image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          {
            echo "## Published"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Digest | \`${DIGEST}\` (multi-arch index) |"
            echo "| Platforms | \`linux/amd64\`, \`linux/arm64\` |"
            echo "| Provenance | [attestation](${ATTESTATION_URL}) |"
            echo "| Docker Hub | [houbystudio/fridgora](https://hub.docker.com/r/houbystudio/fridgora/tags) |"
            echo
            echo "| Tag | Pull |"
            echo "| --- | --- |"
            for tag in ${TAGS//,/ }; do echo "| \`${tag#*:}\` | \`docker pull ${tag}\` |"; done
            echo
            echo "Verify before deploying:"
            echo
            echo '```bash'
            echo "gh attestation verify oci://${IMAGE}@${DIGEST} \\"
            echo "  --repo ${REPO} \\"
            echo "  --signer-workflow ${REPO}/.github/workflows/docker-image.yml \\"
            echo "  --source-ref ${REF}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub Release
    # Only tags produce a GitHub Release, and only once the image is actually published,
    # so a release never advertises a version nobody can pull.
    if: needs.build.outputs.kind == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.build.outputs.version }}
          tag_name: ${{ needs.build.outputs.version }}
          generate_release_notes: true
          body: |
            Docker image:

            ```
            docker pull houbystudio/fridgora:${{ needs.build.outputs.version }}
            ```

            Pin this tag in production rather than `latest`, so a rollback is deterministic.

            The image carries a signed build provenance attestation. Verify it before deploying:

            ```
            gh attestation verify oci://docker.io/houbystudio/fridgora:${{ needs.build.outputs.version }} \
              --repo ${{ github.repository }} \
              --signer-workflow ${{ github.repository }}/.github/workflows/docker-image.yml \
              --source-ref refs/tags/${{ needs.build.outputs.version }}
            ```

      - name: Summarize release
        env:
          URL: ${{ steps.release.outputs.url }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "## Release"
            echo
            echo "🎉 [Release ${VERSION}](${URL}) is published, with notes generated from the merged PRs."
          } >> "$GITHUB_STEP_SUMMARY"

  hub-description:
    name: Docker Hub page
    # The page describes releases, so only a release updates it.
    if: needs.build.outputs.kind == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docker

      # Keeps the overview on Docker Hub in step with docker/README.md. Uses the push token, which
      # needs read/write/delete scope for this. It does not gate the release: a token without that
      # scope, or an expired one, must never stop an image that is already published.
      - name: Update the Docker Hub page
        id: update
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: houbystudio/fridgora
          short-description: 'The office fridge, run like a tiny shop: snacks at cost, pay later by QR. Self-hosted.'
          readme-filepath: ./docker/README.md

      - name: Summarize
        env:
          OUTCOME: ${{ steps.update.outcome }}
        run: |
          {
            echo "## Docker Hub page"
            echo
            if [ "${OUTCOME}" = "success" ]; then
              echo "✅ [houbystudio/fridgora](https://hub.docker.com/r/houbystudio/fridgora) now shows \`docker/README.md\` from this release."
            else
              echo "⚠️ Updating the page failed — the token lacks read/write/delete scope or has expired. The image itself is published."
              echo "::warning::The Docker Hub page update failed; DOCKERHUB_TOKEN needs read/write/delete scope."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
